name: Auto Actualizar Listas IPTV

on:
  schedule:
    # 18:05 UTC = 15:05 en Argentina
    - cron: '5 18 * * *'
  workflow_dispatch: # Permite ejecución manual

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Otorga permisos de escritura nativos al repositorio

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r M3U-SCRAPER/requirements.txt

    - name: Ejecutar el Scraper
      run: |
        python M3U-SCRAPER/scraper.py

    - name: Guardar y subir cambios al repositorio
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Mover los archivos generados a la raíz o agregarlos a Git
        git add listas/principal.m3u listas/deportes.m3u
        
        # Guardar solo si hay cambios en los archivos
        git diff --staged --quiet || git commit -m "Auto-update IPTV lists [skip ci]"
        git push
